<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Preview</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #777;
  padding: 24px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 11.25px;
}
.page {
  position: relative;
  background: white;
  margin: 0 auto 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,.45);
  overflow: hidden;
}
.tb {
  position: absolute;
  /* Joined wrapped paragraphs use the union bbox of their visual lines:
     width matches the column, height spans all lines.  Allow normal wrapping
     so the joined text re-flows inside that bbox instead of being clipped. */
  white-space: normal;
  overflow: visible;
  line-height: 13.50px;
}
.tb-h1 { font-size: 21.00px; font-weight: bold; overflow: visible; }
.tb-h2 { font-size: 18.00px; font-weight: bold; overflow: visible; }
.tb-h3 { font-size: 16.50px; font-weight: bold; overflow: visible; }
.tb-h4 { font-size: 15.00px; font-weight: bold; overflow: visible; }
.cell {
  position: absolute;
  overflow: hidden;
  white-space: pre-line;
  display: flex;
  align-items: center;
  font-size: 11.25px;
  line-height: 13.50px;
  padding: 3.0px 4.5px;
  border: 0.6px solid #AAAAAA;
}
/* heuristic fallback classes (used when no pdf_path is given) */
.rH { background: #D0D0D0; font-weight: bold; justify-content: center; }
.rS { background: #E8E8E8; font-weight: bold; font-size: 10.50px; }
.rT { background: #F0F0F0; font-weight: bold; border-top-color: #000 !important; }
.rK { background: #DDEEFF; font-weight: bold;
       border-top: 1.2px solid #000 !important;
       border-bottom: 1.2px solid #000 !important; }
.rP { font-style: italic; color: #444; }
.num { justify-content: flex-end; }

</style>
</head>
<body>
<div class="page" style="width:918px;height:1188px;"><div class="tb tb-h1" style="left:118.0px;top:124.3px;width:545.3px;height:25.3px;">Sub-Tables Flush With Outer Frame Edges</div><div class="cell" style="left:279.0px;top:177.0px;width:180.0px;height:27.0px;background:#ADD8E6;font-weight:bold;">Item</div><div class="cell" style="left:459.0px;top:177.0px;width:180.0px;height:27.0px;background:#ADD8E6;font-weight:bold;">Qty</div><div class="cell" style="left:279.0px;top:204.0px;width:180.0px;height:27.0px;">Widget A</div><div class="cell" style="left:459.0px;top:204.0px;width:180.0px;height:27.0px;">10</div><div class="cell" style="left:279.0px;top:231.0px;width:180.0px;height:27.0px;">Widget B</div><div class="cell" style="left:459.0px;top:231.0px;width:180.0px;height:27.0px;">5</div><div class="tb" style="left:279.1px;top:270.7px;width:354.2px;height:64.0px;">NOTE: This paragraph sits between two sub-tables that are flush against the outer frame's top and bottom edges. It must survive parsing as a paragraph node inside the outer cell.</div><div class="cell" style="left:279.0px;top:339.0px;width:180.0px;height:27.0px;background:#ADD8E6;font-weight:bold;">Month</div><div class="cell" style="left:459.0px;top:339.0px;width:180.0px;height:27.0px;background:#ADD8E6;font-weight:bold;">Sales</div><div class="cell" style="left:279.0px;top:366.0px;width:180.0px;height:27.0px;">Jan</div><div class="cell" style="left:459.0px;top:366.0px;width:180.0px;height:27.0px;">$500</div><div class="cell" style="left:279.0px;top:393.0px;width:180.0px;height:27.0px;">Feb</div><div class="cell" style="left:459.0px;top:393.0px;width:180.0px;height:27.0px;">$700</div></div>

</body>
</html>
