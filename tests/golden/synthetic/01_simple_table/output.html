<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Preview</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #777;
  padding: 24px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 11.25px;
}
.page {
  position: relative;
  background: white;
  margin: 0 auto 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,.45);
  overflow: hidden;
}
.tb {
  position: absolute;
  overflow: hidden;
  white-space: nowrap;
}
.tb-h1 { font-size: 21.00px; font-weight: bold; overflow: visible; }
.tb-h2 { font-size: 18.00px; font-weight: bold; overflow: visible; }
.tb-h3 { font-size: 16.50px; font-weight: bold; overflow: visible; }
.tb-h4 { font-size: 15.00px; font-weight: bold; overflow: visible; }
.cell {
  position: absolute;
  overflow: hidden;
  display: flex;
  align-items: center;
  font-size: 11.25px;
  line-height: 13.50px;
  padding: 3.0px 4.5px;
  border: 0.6px solid #AAAAAA;
}
/* heuristic fallback classes (used when no pdf_path is given) */
.rH { background: #D0D0D0; font-weight: bold; justify-content: center; }
.rS { background: #E8E8E8; font-weight: bold; font-size: 10.50px; }
.rT { background: #F0F0F0; font-weight: bold; border-top-color: #000 !important; }
.rK { background: #DDEEFF; font-weight: bold;
       border-top: 1.2px solid #000 !important;
       border-bottom: 1.2px solid #000 !important; }
.rP { font-style: italic; color: #444; }
.num { justify-content: flex-end; }

</style>
</head>
<body>
<div class="page" style="width:918px;height:1188px;"><div class="tb tb-h1" style="left:118.0px;top:124.3px;width:283.1px;height:24.9px;">Simple Table Example</div><div class="tb" style="left:117.3px;top:190.3px;width:235.1px;height:10.9px;">The table below has three columns.</div><div class="cell" style="left:359.4px;top:222.0px;width:69.8px;height:27.0px;background:#D3D3D3;font-weight:bold;">Name</div><div class="cell" style="left:429.2px;top:222.0px;width:73.8px;height:27.0px;background:#D3D3D3;font-weight:bold;">Quantity</div><div class="cell" style="left:503.0px;top:222.0px;width:55.6px;height:27.0px;background:#D3D3D3;font-weight:bold;">Price</div><div class="cell" style="left:359.4px;top:249.0px;width:69.8px;height:27.0px;">Apple</div><div class="cell" style="left:429.2px;top:249.0px;width:73.8px;height:27.0px;">3</div><div class="cell" style="left:503.0px;top:249.0px;width:55.6px;height:27.0px;">$1.00</div><div class="cell" style="left:359.4px;top:276.0px;width:69.8px;height:27.0px;">Banana</div><div class="cell" style="left:429.2px;top:276.0px;width:73.8px;height:27.0px;">6</div><div class="cell" style="left:503.0px;top:276.0px;width:55.6px;height:27.0px;">$0.50</div></div>

</body>
</html>
