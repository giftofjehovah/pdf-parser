<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Preview</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #777;
  padding: 24px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 11.25px;
}
.page {
  position: relative;
  background: white;
  margin: 0 auto 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,.45);
  overflow: hidden;
}
.tb {
  position: absolute;
  /* Joined wrapped paragraphs use the union bbox of their visual lines:
     width matches the column, height spans all lines.  Allow normal wrapping
     so the joined text re-flows inside that bbox instead of being clipped. */
  white-space: normal;
  overflow: visible;
  line-height: 13.50px;
}
.tb-h1 { font-size: 21.00px; font-weight: bold; overflow: visible; }
.tb-h2 { font-size: 18.00px; font-weight: bold; overflow: visible; }
.tb-h3 { font-size: 16.50px; font-weight: bold; overflow: visible; }
.tb-h4 { font-size: 15.00px; font-weight: bold; overflow: visible; }
.cell {
  position: absolute;
  overflow: hidden;
  white-space: pre-line;
  display: flex;
  align-items: center;
  font-size: 11.25px;
  line-height: 13.50px;
  padding: 3.0px 4.5px;
  border: 0.6px solid #AAAAAA;
}
/* heuristic fallback classes (used when no pdf_path is given) */
.rH { background: #D0D0D0; font-weight: bold; justify-content: center; }
.rS { background: #E8E8E8; font-weight: bold; font-size: 10.50px; }
.rT { background: #F0F0F0; font-weight: bold; border-top-color: #000 !important; }
.rK { background: #DDEEFF; font-weight: bold;
       border-top: 1.2px solid #000 !important;
       border-bottom: 1.2px solid #000 !important; }
.rP { font-style: italic; color: #444; }
.num { justify-content: flex-end; }

</style>
</head>
<body>
<div class="page" style="width:918px;height:1188px;"><div class="tb tb-h1" style="left:118.0px;top:124.3px;width:240.8px;height:20.0px;">Sections And Lists</div><div class="tb tb-h2" style="left:118.7px;top:194.9px;width:142.9px;height:19.5px;">1. Background</div><div class="tb" style="left:117.3px;top:229.3px;width:226.0px;height:13.9px;">This is the background paragraph.</div><div class="tb tb-h2" style="left:117.5px;top:275.9px;width:109.3px;height:19.5px;">2. Findings</div><div class="tb" style="left:118.0px;top:310.1px;width:106.4px;height:14.1px;">• First finding.</div><div class="tb" style="left:118.0px;top:337.1px;width:128.1px;height:14.1px;">• Second finding.</div><div class="tb" style="left:118.0px;top:364.1px;width:111.4px;height:14.1px;">• Third finding.</div><div class="tb tb-h3" style="left:118.1px;top:413.0px;width:129.9px;height:13.2px;">2.1 Detail Table</div><div class="cell rH" style="left:431.0px;top:438.0px;width:28.0px;height:27.0px;">A</div><div class="cell rH" style="left:459.0px;top:438.0px;width:28.0px;height:27.0px;">B</div><div class="cell rK" style="left:431.0px;top:465.0px;width:28.0px;height:27.0px;">1</div><div class="cell rK" style="left:459.0px;top:465.0px;width:28.0px;height:27.0px;">2</div><div class="cell rK" style="left:431.0px;top:492.0px;width:28.0px;height:27.0px;">3</div><div class="cell rK" style="left:459.0px;top:492.0px;width:28.0px;height:27.0px;">4</div></div>

</body>
</html>
