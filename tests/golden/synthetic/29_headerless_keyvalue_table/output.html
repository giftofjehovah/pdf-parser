<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Preview</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #777;
  padding: 24px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 11.25px;
}
.page {
  position: relative;
  background: white;
  margin: 0 auto 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,.45);
  overflow: hidden;
}
.tb {
  position: absolute;
  /* Joined wrapped paragraphs use the union bbox of their visual lines:
     width matches the column, height spans all lines.  Allow normal wrapping
     so the joined text re-flows inside that bbox instead of being clipped. */
  white-space: normal;
  overflow: visible;
  line-height: 13.50px;
}
.tb-h1 { font-size: 21.00px; font-weight: bold; overflow: visible; }
.tb-h2 { font-size: 18.00px; font-weight: bold; overflow: visible; }
.tb-h3 { font-size: 16.50px; font-weight: bold; overflow: visible; }
.tb-h4 { font-size: 15.00px; font-weight: bold; overflow: visible; }
.cell {
  position: absolute;
  overflow: hidden;
  white-space: pre-line;
  display: flex;
  align-items: center;
  font-size: 11.25px;
  line-height: 13.50px;
  padding: 3.0px 4.5px;
  border: 0.6px solid #AAAAAA;
}
/* heuristic fallback classes (used when no pdf_path is given) */
.rH { background: #D0D0D0; font-weight: bold; justify-content: center; }
.rS { background: #E8E8E8; font-weight: bold; font-size: 10.50px; }
.rT { background: #F0F0F0; font-weight: bold; border-top-color: #000 !important; }
.rK { background: #DDEEFF; font-weight: bold;
       border-top: 1.2px solid #000 !important;
       border-bottom: 1.2px solid #000 !important; }
.rP { font-style: italic; color: #444; }
.num { justify-content: flex-end; }

</style>
</head>
<body>
<div class="page" style="width:918px;height:1188px;"><div class="tb tb-h1" style="left:119.0px;top:124.7px;width:374.4px;height:25.0px;">Headerless Key-Value Listing</div><div class="cell rH" style="left:318.0px;top:186.1px;width:180.0px;height:15.0px;">Revenue</div><div class="cell rH" style="left:498.0px;top:186.1px;width:41.7px;height:15.0px;">$1000</div><div class="cell rK" style="left:318.0px;top:216.1px;width:180.0px;height:15.0px;">Expenses</div><div class="cell rK" style="left:498.0px;top:216.1px;width:41.7px;height:15.0px;">$800</div><div class="cell rK" style="left:318.0px;top:246.1px;width:180.0px;height:15.0px;">Net</div><div class="cell rK" style="left:498.0px;top:246.1px;width:41.7px;height:15.0px;">$200</div></div>

</body>
</html>
