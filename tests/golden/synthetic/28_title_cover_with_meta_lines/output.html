<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Preview</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #777;
  padding: 24px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 11.25px;
}
.page {
  position: relative;
  background: white;
  margin: 0 auto 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,.45);
  overflow: hidden;
}
.tb {
  position: absolute;
  /* Joined wrapped paragraphs use the union bbox of their visual lines:
     width matches the column, height spans all lines.  Allow normal wrapping
     so the joined text re-flows inside that bbox instead of being clipped. */
  white-space: normal;
  overflow: visible;
  line-height: 13.50px;
}
.tb-h1 { font-size: 21.00px; font-weight: bold; overflow: visible; }
.tb-h2 { font-size: 18.00px; font-weight: bold; overflow: visible; }
.tb-h3 { font-size: 16.50px; font-weight: bold; overflow: visible; }
.tb-h4 { font-size: 15.00px; font-weight: bold; overflow: visible; }
.cell {
  position: absolute;
  overflow: hidden;
  white-space: pre-line;
  display: flex;
  align-items: center;
  font-size: 11.25px;
  line-height: 13.50px;
  padding: 3.0px 4.5px;
  border: 0.6px solid #AAAAAA;
}
/* heuristic fallback classes (used when no pdf_path is given) */
.rH { background: #D0D0D0; font-weight: bold; justify-content: center; }
.rS { background: #E8E8E8; font-weight: bold; font-size: 10.50px; }
.rT { background: #F0F0F0; font-weight: bold; border-top-color: #000 !important; }
.rK { background: #DDEEFF; font-weight: bold;
       border-top: 1.2px solid #000 !important;
       border-bottom: 1.2px solid #000 !important; }
.rP { font-style: italic; color: #444; }
.num { justify-content: flex-end; }

</style>
</head>
<body>
<div class="page" style="width:918px;height:1188px;"><div class="tb tb-h1" style="left:120.1px;top:128.4px;width:473.9px;height:39.4px;">Project Phoenix Sample</div><div class="tb tb-h1" style="left:118.7px;top:189.8px;width:488.9px;height:26.6px;">Generic Subtitle Placeholder</div><div class="tb tb-h3" style="left:118.0px;top:240.7px;width:183.3px;height:22.3px;">01 January 2099</div><div class="tb" style="left:117.0px;top:427.5px;width:495.1px;height:15.5px;">Authored by: Alice Example, Lead Coordinator, Sample Department</div><div class="tb" style="left:118.3px;top:475.5px;width:513.0px;height:15.5px;">Reviewed by: Bob Placeholder, Quality Reviewer, Sample Department</div><div class="tb" style="left:118.3px;top:523.6px;width:225.4px;height:15.1px;">Expires on: 31 December 2099</div></div>

</body>
</html>
