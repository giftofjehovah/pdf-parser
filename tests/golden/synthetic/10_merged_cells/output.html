<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Preview</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #777;
  padding: 24px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 11.25px;
}
.page {
  position: relative;
  background: white;
  margin: 0 auto 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,.45);
  overflow: hidden;
}
.tb {
  position: absolute;
  overflow: hidden;
  white-space: nowrap;
}
.tb-h1 { font-size: 21.00px; font-weight: bold; }
.tb-h2 { font-size: 18.00px; font-weight: bold; }
.tb-h3 { font-size: 16.50px; font-weight: bold; }
.tb-h4 { font-size: 15.00px; font-weight: bold; }
.cell {
  position: absolute;
  overflow: hidden;
  display: flex;
  align-items: center;
  font-size: 11.25px;
  line-height: 13.50px;
  padding: 3.0px 4.5px;
  border: 0.6px solid #AAAAAA;
}
/* heuristic fallback classes (used when no pdf_path is given) */
.rH { background: #D0D0D0; font-weight: bold; justify-content: center; }
.rS { background: #E8E8E8; font-weight: bold; font-size: 10.50px; }
.rT { background: #F0F0F0; font-weight: bold; border-top-color: #000 !important; }
.rK { background: #DDEEFF; font-weight: bold;
       border-top: 1.2px solid #000 !important;
       border-bottom: 1.2px solid #000 !important; }
.rP { font-style: italic; color: #444; }
.num { justify-content: flex-end; }

</style>
</head>
<body>
<div class="page" style="width:918px;height:1188px;"><div class="tb tb-h1" style="left:117.0px;top:115.1px;width:286.6px;height:37.2px;">Merged Cells Example</div><div class="cell" style="left:226.5px;top:177.0px;width:225.0px;height:27.0px;background:#D3D3D3;font-weight:bold;">Quarterly Report</div><div class="cell num" style="left:451.5px;top:177.0px;width:120.0px;height:27.0px;background:#D3D3D3;font-weight:bold;"></div><div class="cell num" style="left:571.5px;top:177.0px;width:120.0px;height:27.0px;background:#D3D3D3;font-weight:bold;"></div><div class="cell" style="left:226.5px;top:204.0px;width:225.0px;height:27.0px;background:#D3D3D3;font-weight:bold;">Region</div><div class="cell num" style="left:451.5px;top:204.0px;width:120.0px;height:27.0px;background:#D3D3D3;font-weight:bold;">Q1</div><div class="cell num" style="left:571.5px;top:204.0px;width:120.0px;height:27.0px;background:#D3D3D3;font-weight:bold;">Q2</div><div class="cell" style="left:226.5px;top:231.0px;width:225.0px;height:27.0px;">North</div><div class="cell num" style="left:451.5px;top:231.0px;width:120.0px;height:27.0px;">100</div><div class="cell num" style="left:571.5px;top:231.0px;width:120.0px;height:27.0px;">200</div><div class="cell" style="left:226.5px;top:258.0px;width:225.0px;height:27.0px;"></div><div class="cell num" style="left:451.5px;top:258.0px;width:120.0px;height:27.0px;">120</div><div class="cell num" style="left:571.5px;top:258.0px;width:120.0px;height:27.0px;">180</div><div class="cell" style="left:226.5px;top:285.0px;width:225.0px;height:27.0px;">South</div><div class="cell num" style="left:451.5px;top:285.0px;width:120.0px;height:27.0px;">300</div><div class="cell num" style="left:571.5px;top:285.0px;width:120.0px;height:27.0px;">400</div></div>

</body>
</html>
