<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Preview</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #777;
  padding: 24px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 11.25px;
}
.page {
  position: relative;
  background: white;
  margin: 0 auto 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,.45);
  overflow: hidden;
}
.tb {
  position: absolute;
  overflow: hidden;
  white-space: nowrap;
}
.tb-h1 { font-size: 21.00px; font-weight: bold; overflow: visible; }
.tb-h2 { font-size: 18.00px; font-weight: bold; overflow: visible; }
.tb-h3 { font-size: 16.50px; font-weight: bold; overflow: visible; }
.tb-h4 { font-size: 15.00px; font-weight: bold; overflow: visible; }
.cell {
  position: absolute;
  overflow: hidden;
  display: flex;
  align-items: center;
  font-size: 11.25px;
  line-height: 13.50px;
  padding: 3.0px 4.5px;
  border: 0.6px solid #AAAAAA;
}
/* heuristic fallback classes (used when no pdf_path is given) */
.rH { background: #D0D0D0; font-weight: bold; justify-content: center; }
.rS { background: #E8E8E8; font-weight: bold; font-size: 10.50px; }
.rT { background: #F0F0F0; font-weight: bold; border-top-color: #000 !important; }
.rK { background: #DDEEFF; font-weight: bold;
       border-top: 1.2px solid #000 !important;
       border-bottom: 1.2px solid #000 !important; }
.rP { font-style: italic; color: #444; }
.num { justify-content: flex-end; }

</style>
</head>
<body>
<div class="page" style="width:918px;height:1188px;"><div class="tb tb-h1" style="left:117.6px;top:124.3px;width:325.2px;height:20.0px;">Text Between Sub-Tables</div><div class="cell" style="left:234.0px;top:177.0px;width:450.0px;height:30.0px;background:#D3D3D3;font-weight:bold;">Section Header</div><div class="cell" style="left:234.0px;top:207.0px;width:450.0px;height:219.0px;"><div class="cell" style="left:9.0px;top:6.0px;width:135.0px;height:27.0px;background:#ADD8E6;font-weight:bold;">Item</div><div class="cell" style="left:144.0px;top:6.0px;width:135.0px;height:27.0px;background:#ADD8E6;font-weight:bold;">Qty</div><div class="cell" style="left:9.0px;top:33.0px;width:135.0px;height:27.0px;">Widget A</div><div class="cell" style="left:144.0px;top:33.0px;width:135.0px;height:27.0px;">10</div><div class="cell" style="left:9.0px;top:60.0px;width:135.0px;height:27.0px;">Widget B</div><div class="cell" style="left:144.0px;top:60.0px;width:135.0px;height:27.0px;">5</div><div class="cell" style="left:9.0px;top:132.0px;width:135.0px;height:27.0px;background:#ADD8E6;font-weight:bold;">Month</div><div class="cell" style="left:144.0px;top:132.0px;width:135.0px;height:27.0px;background:#ADD8E6;font-weight:bold;">Sales</div><div class="cell" style="left:9.0px;top:159.0px;width:135.0px;height:27.0px;">Jan</div><div class="cell" style="left:144.0px;top:159.0px;width:135.0px;height:27.0px;">$500</div><div class="cell" style="left:9.0px;top:186.0px;width:135.0px;height:27.0px;">Feb</div><div class="cell" style="left:144.0px;top:186.0px;width:135.0px;height:27.0px;">$700</div></div><div class="cell" style="left:234.0px;top:426.0px;width:450.0px;height:30.0px;">Section Footer</div></div>

</body>
</html>
