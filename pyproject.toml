[project]
name = "pdf-parser"
version = "0.1.0"
description = "Deterministic layout-first PDF parser with nested-table support."
requires-python = ">=3.11,<3.14"
dependencies = [
    "pymupdf==1.24.10",
    "pdfplumber==0.11.4",
    "pydantic==2.9.2",
    "typer==0.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "hypothesis==6.115.0",
    "reportlab==4.2.5",
    "pillow==10.4.0",
]
llm = [
    "anthropic==0.39.0",
]

[project.scripts]
pdf-parser = "pdf_parser.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
